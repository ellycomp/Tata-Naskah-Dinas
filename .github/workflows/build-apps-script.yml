name: Build Google Apps Script

on:
  push:
    branches:
      - feature/google-drive-sync
    paths-ignore:
      - 'gas/Index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: feature/google-drive-sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app and Apps Script HTML
        run: npm run build

      - name: Commit generated Apps Script HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gas/Index.html
          if git diff --cached --quiet; then
            echo "gas/Index.html is already up to date."
          else
            git commit -m "Build Google Apps Script web app"
            git push origin HEAD:feature/google-drive-sync
          fi
